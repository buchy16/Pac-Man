[project]
name = "pac-man"
version = "0.1.0"
description = "Pac_Man !!!!"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "commentjson",
    "keysymdef>=1.2.0",
    "mazegenerator",
    "mlx",
    "pydantic>=2.13.5",
]

# Isolement des outils de test/qualité
[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mlx = { path = "modules/mlx-2.4-py3-none-any.whl" }
mazegenerator = { path = "modules/mazegenerator-2.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
# avant sa collecte des tests, pytest ajoutera '.' (racine du projet) à sys.path
pythonpath = ["."]
# afficher le nom de chaque fonction pdt les tests
addopts = "-v"